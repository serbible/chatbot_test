[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-mongodb-chatbot"
version = "0.1.0"
description = "A basic chatbot API built with FastAPI, MongoDB, and OpenAI or Anthropic."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.49,<1.0",
    "fastapi>=0.115,<1.0",
    "motor>=3.7,<4.0",
    "openai>=1.68,<2.0",
    "pydantic-settings>=2.8,<3.0",
    "pymongo>=4.9,<5.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
