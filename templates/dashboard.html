<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <title>내 계정 | Chatbot AI</title>
    <link rel="stylesheet" href="/static/site.css">
  </head>
  <body class="dashboard-page">
    <header class="dashboard-header">
      <nav class="dashboard-nav" aria-label="계정 메뉴">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>Chatbot AI</span>
        </a>
        <div class="dashboard-links">
          <a class="button secondary" href="/chat">챗봇 열기</a>
          <button class="button secondary" id="logout-button" type="button">로그아웃</button>
        </div>
      </nav>
    </header>

    <main class="dashboard-content">
      <div class="dashboard-title">
        <h1>내 계정</h1>
        <p>가입 정보와 개인 대화 공간을 확인할 수 있습니다.</p>
      </div>

      <section class="profile-card" aria-labelledby="profile-heading">
        <div class="profile-card-head">
          <div class="profile-avatar" id="profile-avatar" aria-hidden="true">✦</div>
          <div>
            <h2 id="profile-heading">회원 정보</h2>
            <p id="profile-subtitle">내 계정 정보를 불러오는 중입니다.</p>
          </div>
        </div>
        <div class="profile-fields">
          <div class="profile-field">
            <span>이름</span>
            <strong id="profile-name">불러오는 중...</strong>
          </div>
          <div class="profile-field">
            <span>이메일</span>
            <strong id="profile-email">불러오는 중...</strong>
          </div>
          <div class="profile-field">
            <span>가입일</span>
            <strong id="profile-created">불러오는 중...</strong>
          </div>
          <div class="profile-field">
            <span>계정 상태</span>
            <strong>로그인됨</strong>
          </div>
        </div>
      </section>
      <p class="dashboard-note" id="dashboard-message" role="status" aria-live="polite">
        이 페이지에는 현재 로그인한 계정의 정보만 표시됩니다. 비밀번호 원문은 저장되거나 표시되지 않습니다.
      </p>
    </main>
    <script>
      const message = document.querySelector("#dashboard-message");

      async function loadProfile() {
        try {
          const response = await fetch("/api/auth/me");
          if (response.status === 401) {
            window.location.replace("/login");
            return;
          }
          const profile = await response.json();
          if (!response.ok) {
            throw new Error(profile.detail || "회원 정보를 불러오지 못했습니다.");
          }
          document.querySelector("#profile-heading").textContent = `${profile.name}님, 환영합니다`;
          document.querySelector("#profile-subtitle").textContent = "로그인된 계정의 프로필입니다.";
          document.querySelector("#profile-avatar").textContent = profile.name.slice(0, 1);
          document.querySelector("#profile-name").textContent = profile.name;
          document.querySelector("#profile-email").textContent = profile.email;
          document.querySelector("#profile-created").textContent =
            new Intl.DateTimeFormat("ko-KR", { dateStyle: "long" }).format(
              new Date(profile.created_at),
            );
        } catch (error) {
          message.textContent =
            error instanceof Error ? error.message : "회원 정보를 불러오지 못했습니다.";
        }
      }

      document.querySelector("#logout-button").addEventListener("click", async () => {
        const response = await fetch("/api/auth/logout", { method: "POST" });
        if (response.ok) {
          window.location.assign("/login");
        } else {
          message.textContent = "로그아웃하지 못했습니다. 다시 시도해 주세요.";
        }
      });

      loadProfile();
    </script>
  </body>
</html>
